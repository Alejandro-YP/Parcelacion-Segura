<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parcelación Segura - Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f6f8;
        }

        /* CONTENEDOR PRINCIPAL */

        .login-container {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }


        /* TITULO */

        .login-title {
            text-align: center;

            margin-bottom: 10px;

            font-size: 28px;

            color: #222;
        }


        .login-subtitle {
            text-align: center;

            margin-bottom: 30px;

            color: #777;

            font-size: 15px;
        }


        /* CAMPOS */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }


        .form-group input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }


        .form-group input:focus {
            outline: none;

            border-color: #555;
        }


        /* BOTON */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 5px;
        }


        .login-button:hover {
            background: #444;
        }


        /* MENSAJE */

        #mensaje {
            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            min-height: 20px;
        }
    </style>

</head>


<body>


    <!-- CONTENEDOR DEL LOGIN -->

    <div class="login-container">


        <!-- TITULO -->

        <h1 class="login-title">
            Parcelación Segura
        </h1>


        <p class="login-subtitle">
            Inicie sesión para continuar
        </p>



        <!-- FORMULARIO -->

        <form id="loginForm">


            <!-- USUARIO -->

            <div class="form-group">

                <label for="usuario">
                    Usuario
                </label>

                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>

            </div>



            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>

            </div>



            <!-- BOTON -->

            <button type="submit" class="login-button">
                Iniciar sesión
            </button>



            <!-- MENSAJE -->

            <div id="mensaje"></div>


        </form>


    </div>



    <!-- JAVASCRIPT -->

    <script>

        // Obtener formulario
        const loginForm = document.getElementById("loginForm");


        // Obtener espacio para mensajes
        const mensaje = document.getElementById("mensaje");


        // Detectar envío del formulario
        loginForm.addEventListener("submit", async function (event) {

            // Evitar que la página se recargue
            event.preventDefault();


            // Obtener usuario
            const usuario =
                document.getElementById("usuario").value;


            // Obtener contraseña
            const contrasena =
                document.getElementById("contrasena").value;


            try {

                // Enviar información al backend
                const respuesta = await fetch(
                    "http://localhost:3000/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            usuario: usuario,

                            contrasena: contrasena,

                        })
                    }
                );


                // Convertir respuesta a JSON
                const datos = await respuesta.json();


                // LOGIN CORRECTO

                if (respuesta.ok) {

                    mensaje.textContent =
                        "Inicio de sesión exitoso.";

                    mensaje.style.color = "green";


                    // Guardar información del usuario
                    localStorage.setItem(
                        "usuario",
                        JSON.stringify(datos.usuario)
                    );


                    // Ir al dashboard
                    setTimeout(function () {

                        window.location.href =
                            "../dashboard.html";

                    }, 1000);
                }

                // LOGIN INCORRECTO

                else {

                    mensaje.textContent =
                        datos.mensaje;

                    mensaje.style.color = "red";

                }


            }

            catch (error) {

                console.error(error);

                mensaje.textContent =
                    "No se pudo conectar con el servidor.";

                mensaje.style.color = "red";

            }

        });

    </script>


</body>

</html>
