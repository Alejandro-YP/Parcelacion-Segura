<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcelacion Segura - Iniciar sesion</title>
    <!-- login-style.css depende de las variables definidas en dashboard-style.css,
     por eso se cargan en este orden. -->
    <link rel="stylesheet" href="/frontend/css/dashboard-style.css">
    <link rel="stylesheet" href="/frontend/css/login-style.css">
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-card__brand">
            <div class="login-card__mark" aria-hidden="true">
                <img src="/frontend/imgs/menu-secure.png" alt="">
            </div>
            <h1 class="login-title">Parcelacion Segura</h1>
            <p class="login-subtitle">Inicie sesion para continuar</p>
        </div>

        <form id="loginForm" class="login-form">

            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contrasena</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contrasena" required>
            </div>

            <button type="submit" class="btn btn--primary btn--block">Iniciar sesion</button>

            <div id="mensaje" class="login-message"></div>
        </form>

    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const mensaje = document.getElementById('mensaje');

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;

            try {
                // Nota: se uso una ruta relativa ("/login") en vez de
                // "http://localhost:3000/login" para que funcione sin cambios sin
                // importar el puerto o dominio, siempre que el backend sirva este
                // frontend (o este detras del mismo proxy/dominio). Si el backend
                // corre en otro origen, volver a poner aqui la URL completa.
                const respuesta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, contrasena })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.textContent = 'Inicio de sesion exitoso.';
                    mensaje.className = 'login-message login-message--ok';

                    localStorage.setItem('usuario', JSON.stringify(datos.usuario));

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    mensaje.textContent = datos.mensaje;
                    mensaje.className = 'login-message login-message--error';
                }
            } catch (error) {
                console.error(error);
                mensaje.textContent = 'No se pudo conectar con el servidor.';
                mensaje.className = 'login-message login-message--error';
            }
        });
    </script>

</body>

</html>
