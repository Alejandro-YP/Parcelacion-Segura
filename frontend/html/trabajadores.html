<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trabajadores - Parcelación Segura</title>

    <link rel="stylesheet" href="css/dashboard-style.css">
</head>

<body>

    <h1>Gestión de Trabajadores</h1>

    <button id="btnAgregar">+ Agregar trabajador</button>
    <div id="formularioTrabajador" style="display: none;">

    <h2>Registrar trabajador</h2>

    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" placeholder="Ingrese el nombre">

    <br><br>

    <label for="documento">Documento:</label>
    <input type="text" id="documento" placeholder="Ingrese el documento">

    <br><br>

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" placeholder="Ingrese el teléfono">

    <br><br>

    <label for="actividad">Actividad:</label>
    <input type="text" id="actividad" placeholder="Ingrese la actividad">

    <br><br>

    <button id="btnGuardar">Guardar trabajador</button>
    <button id="btnCancelar">Cancelar</button>

</div>

    <br><br>

    <input
        type="text"
        id="buscarTrabajador"
        placeholder="Buscar trabajador..."
    >

    <br><br>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Teléfono</th>
                <th>Actividad</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="listaTrabajadores">

            <tr>
                <td>1</td>
                <td>Juan Pérez</td>
                <td>123456789</td>
                <td>3001234567</td>
                <td>Construcción</td>
                <td>Activo</td>

                <td>
                    <button>Editar</button>
                    <button>Eliminar</button>
                </td>
            </tr>

        </tbody>

    </table>
    <script src="js/trabajadores.js"></script>

</body>

</html>
